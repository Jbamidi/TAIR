services:
  ros2:
    build:
      context: .
      dockerfile: Dockerfile
    image: ros:humble-ros-base-jammy
    platform: linux/arm64
    container_name: dim_ros2
    working_dir: /workspace
    volumes:
      - ./:/workspace
    environment:
      - DISPLAY=host.docker.internal:0
      - QT_X11_NO_MITSHM=1
      - LIBGL_ALWAYS_INDIRECT=1
      - ROS_DOMAIN_ID=0
    stdin_open: true
    tty: true
    restart: unless-stopped
